services:
  billing-db:
    image: mysql:8.0
    container_name: billing-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "${BILLING_DB_HOST_PORT}:3306"
    volumes:
      - billing_db_data:/var/lib/mysql
      - ./db/billingdb.sql:/docker-entrypoint-initdb.d/billingdb.sql:ro
    networks:
      - billing_network

  billing:
    image: lironsaada/billing.svc:4
    container_name: billing
    restart: always
    depends_on:
      - billing-db
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: ${DB_PORT}
      WEIGHT_SERVICE_URL: ${WEIGHT_SERVICE_URL}
      RATES_DIR: ${RATES_DIR}
      PORT: ${PORT}
    ports:
      - "${BILLING_HOST_PORT}:${PORT}"
    volumes:
      - ./in:/in
    networks:
      - purple_network
      - billing_network

volumes:
  billing_db_data:

networks:
  purple_network:
    driver: bridge
  billing_network:
    driver: bridge

