services:
  billing-db:
    image: mysql:8.0
    container_name: billing-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${BILLING_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${BILLING_MYSQL_DATABASE}
    volumes:
      - billing_db_data:/var/lib/mysql
      - ./db/billingdb.sql:/docker-entrypoint-initdb.d/billingdb.sql:ro
    networks:
      - billing_network

  billing:
    build: .
    container_name: billing
    restart: always
    depends_on:
      - billing-db
    environment:
      DB_HOST: ${BILLING_DB_HOST}
      DB_USER: ${BILLING_DB_USER}
      DB_PASSWORD: ${BILLING_DB_PASSWORD}
      DB_NAME: ${BILLING_DB_NAME}
      DB_PORT: ${BILLING_DB_PORT}
      WEIGHT_SERVICE_URL: ${WEIGHT_SERVICE_URL}
      RATES_DIR: ${RATES_DIR}
      PORT: ${BILLING_SVC_PORT}
    ports:
      - "${BILLING_HOST_PORT}:${BILLING_SVC_PORT}"
    volumes:
      - ./in:/in
    networks:
      - purple_network
      - billing_network

volumes:
  billing_db_data:

networks:
  purple_network:
    external: true
  billing_network:
    driver: bridge

