services:
  # Service 1: The Database
  weight-db:
    image: mysql:8.0
    container_name: weight-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      # CHANGED: Path is now local to this folder
      - ./db/weightdb.sql:/docker-entrypoint-initdb.d/weightdb.sql
      - weight_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    ports:
      - "${DB_HOST_PORT}:3306"

  # Service 2: Python API
  weight-app:
    # CHANGED: Build context is now the current directory
    build: .
    container_name: weight-app
    restart: always
    ports:
      - "${APP_HOST_PORT}:5000"
    volumes:
      # CHANGED: Paths are now local
      - ./app:/app
      - ./in:/in
    depends_on:
      weight-db:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: weight
    networks:
      - purple_network

volumes:
  weight_data:

networks:
  purple_network:
    name: purple_network
    external: true