version: '3.9'

networks:
  purple_network:
    driver: bridge

  billing_network:
    external: true
    name: purple_network

volumes:
  weight_data:
  billing_db_data:

services:

  weight-db:
    env_file:
      - ../weight/.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    extends:
      file: ../weight/docker-compose.yml
      service: weight-db
    networks:
      - purple_network

  weight-app:
    env_file:
      - ../weight/.env
    environment:
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: weight
    extends:
      file: ../weight/docker-compose.yml
      service: weight-app
    networks:
      - purple_network

  billing-db:
    env_file:
      - ../billing/.env
    extends:
      file: ../billing/docker-compose.yml
      service: billing-db
    networks:
      - purple_network

  billing:
    env_file:
      - ../billing/.env
    extends:
      file: ../billing/docker-compose.yml
      service: billing
    networks:
      - purple_network
