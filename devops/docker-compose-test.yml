version: '3.9'

networks:
  purple_network:
    driver: bridge

  # רק כדי להרגיע את Docker – לא באמת נשתמש בה
  billing_network:
    external: true
    name: purple_network   # טריק: מכוון לרשת האמיתית

services:

  weight-db:
    extends:
      file: ../weight/docker-compose.yml
      service: weight-db
    networks:
      - purple_network

  weight-app:
    extends:
      file: ../weight/docker-compose.yml
      service: weight-app
    networks:
      - purple_network

  billing-db:
    extends:
      file: ../billing/docker-compose.yml
      service: billing-db
    networks:
      - purple_network

  billing:
    extends:
      file: ../billing/docker-compose.yml
      service: billing
    networks:
      - purple_network
