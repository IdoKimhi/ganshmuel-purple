
networks:
  purple_network:
    driver: bridge

  billing_network:
    external: true
    name: purple_network

volumes:
  weight_data:
  billing_db_data:

services:

  # ================================
  #           WEIGHT DB
  # ================================
  weight-db:
    extends:
      file: ../weight/docker-compose.yml
      service: weight-db
    networks:
      - purple_network
    volumes:
      - ../weight/db/weightdb.sql:/docker-entrypoint-initdb.d/weightdb.sql
      - weight_data:/var/lib/mysql
    environment: # <-- Correctly defined:
      TZ: Asia/Jerusalem # <-- All variables are indented under this line
      MYSQL_ROOT_PASSWORD: ${WEIGHT_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${WEIGHT_MYSQL_DATABASE}
      DB_PORT: ${WEIGHT_DB_CONTAINER_PORT}
    ports:
      - ${WEIGHT_DB_HOST_PORT}:${WEIGHT_DB_CONTAINER_PORT}
      
  # ================================
  #           WEIGHT APP
  # ================================
  weight-app:
    extends:
      file: ../weight/docker-compose.yml
      service: weight-app
    networks:
      - purple_network
    environment: # <-- Correctly defined:
      TZ: Asia/Jerusalem # <-- All variables are indented under this line
      DB_USER: ${WEIGHT_DB_USER}
      DB_PASSWORD: ${WEIGHT_DB_PASSWORD}
      DB_HOST: ${WEIGHT_DB_HOST}      
      
  # --- BILLING DB ---
  billing-db:
    extends:
      file: ../billing/docker-compose.yml
      service: billing-db
    networks:
      - purple_network
    environment: # <-- Correctly defined:
      TZ: Asia/Jerusalem # <-- All variables are indented under this line
      MYSQL_ROOT_PASSWORD: ${BILLING_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${BILLING_MYSQL_DATABASE}   
      DB_PORT: ${BILLING_DB_PORT}
    ports:
      - ${BILLING_DB_HOST_PORT}:${BILLING_DB_PORT}           

  # --- BILLING APP ---
  billing:
    extends:
      file: ../billing/docker-compose.yml
      service: billing
    networks:
      - purple_network
    environment: # <-- Correctly defined:
      TZ: Asia/Jerusalem # <-- All variables are indented under this line
      DB_USER: ${BILLING_DB_USER}
      DB_PASSWORD: ${BILLING_DB_PASSWORD}
      DB_HOST: ${BILLING_DB_HOST}
      DB_NAME: ${BILLING_DB_NAME}
      DB_PORT: ${BILLING_DB_PORT}
      WEIGHT_SERVICE_URL: ${WEIGHT_SERVICE_URL}
      BILLING_SVC_PORT: ${BILLING_SVC_PORT}  
    ports:
      - ${BILLING_HOST_PORT}:${BILLING_SVC_PORT}