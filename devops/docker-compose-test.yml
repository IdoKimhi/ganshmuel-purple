version: '3.9'

networks:
  purple_network:
    driver: bridge

  billing_network:
    external: true
    name: purple_network

volumes:
  weight_data:       # ← הוספנו כדי לפתור את השגיאה
  billing_db_data:   # ← גם זה יידרש בהמשך

services:

  weight-db:
    extends:
      file: ../weight/docker-compose.yml
      service: weight-db
    networks:
      - purple_network

  weight-app:
    extends:
      file: ../weight/docker-compose.yml
      service: weight-app
    networks:
      - purple_network

  billing-db:
    extends:
      file: ../billing/docker-compose.yml
      service: billing-db
    networks:
      - purple_network

  billing:
    extends:
      file: ../billing/docker-compose.yml
      service: billing
    networks:
      - purple_network
