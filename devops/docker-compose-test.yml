version: '3.9'

networks:
  purple_network:
    driver: bridge

  billing_network:
    external: true
    name: purple_network

volumes:
  weight_data:
  billing_db_data:

services:

  weight-db:
    extends:
      file: ../weight/docker-compose.yml
      service: weight-db
    env_file:
      - ./.env
    networks:
      - purple_network
    volumes:
      - ../weight/db/weightdb.sql:/docker-entrypoint-initdb.d/weightdb.sql
      - weight_data:/var/lib/mysql


  # ================================
  #           WEIGHT APP
  # ================================
  weight-app:
    extends:
      file: ../weight/docker-compose.yml
      service: weight-app
    env_file:
      - ./.env
    networks:
      - purple_network
  # --- BILLING DB ---
  billing-db:
    extends:
      file: ../billing/docker-compose.yml
      service: billing-db
    networks:
      - purple_network

  # --- BILLING APP ---
  billing:
    extends:
      file: ../billing/docker-compose.yml
      service: billing
    networks:
      - purple_network
