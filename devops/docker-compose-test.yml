version: '3.9'

networks:
  purple_network:
    driver: bridge

  billing_network:
    external: true
    name: purple_network

volumes:
  weight_data:
  billing_db_data:

services:

  weight-db:
  env_file:
    - ../weight/.env                        # ← נטען ראשון
  environment:
    MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    MYSQL_DATABASE: ${MYSQL_DATABASE}       # ← מקבל ערכים מתוך ה־env_file
  extends:
    file: ../weight/docker-compose.yml
    service: weight-db                      # ← נטען אחרי שהמשתנים קיימים
  networks:
    - purple_network


  weight-app:
    extends:
      file: ../weight/docker-compose.yml
      service: weight-app
    env_file:
      - ../weight/.env
    environment:                       # ← חובה גם פה
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: weight
    networks:
      - purple_network

  billing-db:
    extends:
      file: ../billing/docker-compose.yml
      service: billing-db
    env_file:
      - ../billing/.env
    networks:
      - purple_network

  billing:
    extends:
      file: ../billing/docker-compose.yml
      service: billing
    env_file:
      - ../billing/.env
    networks:
      - purple_network
