services:
  ci_server:
    build:
      context: .
      dockerfile: dockerfile

    restart: always

    ports:
      - "8080:8080"

    env_file:
      - .env
      - recipient_config.env

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

    working_dir: /app_root/devops

    command: ["python", "app.py"]
