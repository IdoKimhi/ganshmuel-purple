version: "3.9"
services:
  ci_server:
    build:
      context: .
      dockerfile: dockerfile
    restart: always
    network_mode: "host"
    env_file:
      - .env
      - recipient_config.env
    volumes:
      - ../:/app_root:rw
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app_root/devops
    command: ["python", "app.py"]
