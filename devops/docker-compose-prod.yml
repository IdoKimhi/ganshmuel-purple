version: "3.9"

networks:
  purple_network:
    driver: bridge

volumes:
  weight_data:
  billing_db_data:

services:

  # ================================
  #           WEIGHT DB
  # ================================
  weight-db:
    container_name: weight-db-prod
    extends:
      file: ../weight/docker-compose.yml
      service: weight-db
    networks:
      - purple_network
    volumes:
      - ../weight/db/weightdb.sql:/docker-entrypoint-initdb.d/weightdb.sql
      - weight_data:/var/lib/mysql
    environment:
      TZ: Asia/Jerusalem
      MYSQL_ROOT_PASSWORD: ${WEIGHT_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${WEIGHT_MYSQL_DATABASE}
      DB_PORT: ${WEIGHT_DB_CONTAINER_PORT}
    ports:
      - "8081:${WEIGHT_DB_CONTAINER_PORT}"

  # ================================
  #           WEIGHT APP
  # ================================
  weight-app:
    container_name: weight-app-prod
    extends:
      file: ../weight/docker-compose.yml
      service: weight-app
    networks:
      - purple_network
    environment:
      TZ: Asia/Jerusalem
      DB_USER: ${WEIGHT_DB_USER}
      DB_PASSWORD: ${WEIGHT_DB_PASSWORD}
      DB_HOST: ${WEIGHT_DB_HOST}
      DB_NAME: ${WEIGHT_MYSQL_DATABASE}
      DB_PORT: ${WEIGHT_DB_CONTAINER_PORT}
    ports:
      - "8082:5000"

  # ================================
  #           BILLING DB
  # ================================
  billing-db:
    container_name: billing-db-prod
    extends:
      file: ../billing/docker-compose.yml
      service: billing-db
    networks:
      - purple_network
    environment:
      TZ: Asia/Jerusalem
      MYSQL_ROOT_PASSWORD: ${BILLING_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${BILLING_MYSQL_DATABASE}
      DB_PORT: ${BILLING_DB_PORT}
    ports:
      - "8083:${BILLING_DB_PORT}"

  # ================================
  #           BILLING APP
  # ================================
  billing:
    container_name: billing-app-prod
    extends:
      file: ../billing/docker-compose.yml
      service: billing
    networks:
      - purple_network
    environment:
      TZ: Asia/Jerusalem
      DB_USER: ${BILLING_DB_USER}
      DB_PASSWORD: ${BILLING_DB_PASSWORD}
      DB_HOST: ${BILLING_DB_HOST}
      DB_NAME: ${BILLING_DB_NAME}
      DB_PORT: ${BILLING_DB_PORT}
      WEIGHT_SERVICE_URL: ${WEIGHT_SERVICE_URL}
      BILLING_SVC_PORT: ${BILLING_SVC_PORT}
    ports:
      - "8084:${BILLING_SVC_PORT}"
