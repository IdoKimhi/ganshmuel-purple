networks:
  purple_network:
    driver: bridge

volumes:
  weight_data:
  billing_db_data:


services:

  # ================================
  #           WEIGHT DB
  # ================================
  weight-db:
    image: mysql:8.0
    container_name: weight-db-prod
    restart: always

    networks:
      - purple_network

    environment:
      TZ: Asia/Jerusalem
      MYSQL_ROOT_PASSWORD: ${WEIGHT_MYSQL_ROOT_PASSWORD_PROD}
      MYSQL_DATABASE: ${WEIGHT_MYSQL_DATABASE_PROD}
      WEIGHT_DB_CONTAINER_PORT: ${WEIGHT_DB_CONTAINER_PORT}

    volumes:
      - ../weight/db/weightdb.sql:/docker-entrypoint-initdb.d/weightdb.sql
      - weight_data:/var/lib/mysql

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 40s
      retries: 10

    ports:
      - "${WEIGHT_DB_HOST_PORT_PROD}:${WEIGHT_DB_CONTAINER_PORT}"

  # ================================
  #           WEIGHT APP
  # ================================
  weight-app:
    build:
      context: ../weight
      dockerfile: Dockerfile
    container_name: weight-app-prod
    restart: always

    networks:
      - purple_network

    depends_on:
      weight-db:
        condition: service_healthy

    environment:
      TZ: Asia/Jerusalem
      WEIGHT_DB_USER: ${WEIGHT_DB_USER_PROD}
      WEIGHT_DB_PASSWORD: ${WEIGHT_DB_PASSWORD_PROD}
      WEIGHT_DB_HOST: ${WEIGHT_DB_HOST_PROD}
      WEIGHT_DB_CONTAINER_PORT: ${WEIGHT_DB_CONTAINER_PORT}
      WEIGHT_MYSQL_DATABASE: ${WEIGHT_MYSQL_DATABASE_PROD}

    volumes:
      - ../weight/app:/app
      - ../weight/in:/in

    ports:
      - "${WEIGHT_APP_HOST_PORT_PROD}:5000"

  # ================================
  #           BILLING DB
  # ================================
  billing-db:
    image: mysql:8.0
    container_name: billing-db-prod
    restart: always

    networks:
      - purple_network

    environment:
      TZ: Asia/Jerusalem
      MYSQL_ROOT_PASSWORD: ${BILLING_MYSQL_ROOT_PASSWORD_PROD}
      MYSQL_DATABASE: ${BILLING_MYSQL_DATABASE_PROD}
      DB_PORT: ${BILLING_DB_PORT_PROD}

    volumes:
      - billing_db_data:/var/lib/mysql
      - ../billing/db/billingdb.sql:/docker-entrypoint-initdb.d/billingdb.sql:ro

    ports:
      - "${BILLING_DB_HOST_PORT_PROD}:${BILLING_DB_PORT_PROD}"

  # ================================
  #           BILLING APP
  # ================================
  billing:
    build:
      context: ../billing
      dockerfile: Dockerfile
    container_name: billing-app-prod
    restart: always

    networks:
      - purple_network

    depends_on:
      - billing-db

    environment:
      TZ: Asia/Jerusalem
      DB_USER: ${BILLING_DB_USER_PROD}
      DB_PASSWORD: ${BILLING_DB_PASSWORD_PROD}
      DB_HOST: ${BILLING_DB_HOST_PROD}
      DB_NAME: ${BILLING_DB_NAME_PROD}
      DB_PORT: ${BILLING_DB_PORT_PROD}
      WEIGHT_SERVICE_URL: ${WEIGHT_SERVICE_URL_PROD}
      BILLING_SVC_PORT: ${BILLING_SVC_PORT_PROD}
      PORT: ${BILLING_SVC_PORT_PROD}
      RATES_DIR: /app/rates

    volumes:
      - ../billing/in:/in

    ports:
      - "${BILLING_HOST_PORT_PROD}:${BILLING_SVC_PORT_PROD}"
