version: "3.9"

networks:
  purple_network:
    driver: bridge

volumes:
  weight_data:
  billing_db_data:

services:

  # ================================
  #           WEIGHT DB
  # ================================
  weight-db-prod:
    image: mysql:8.0
    container_name: weight-db-prod
    restart: always
    networks:
      - purple_network
    environment:
      MYSQL_ROOT_PASSWORD: ${WEIGHT_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${WEIGHT_MYSQL_DATABASE}
      TZ: Asia/Jerusalem
    volumes:
      - ../weight/db/weightdb.sql:/docker-entrypoint-initdb.d/weightdb.sql
      - weight_data:/var/lib/mysql
    ports:
      - "8081:3306"

  # ================================
  #           WEIGHT APP
  # ================================
  weight-app-prod:
    build: ../weight
    container_name: weight-app-prod
    restart: always
    networks:
      - purple_network
    environment:
      DB_USER: ${WEIGHT_DB_USER}
      DB_PASSWORD: ${WEIGHT_DB_PASSWORD}
      DB_HOST: weight-db-prod
      DB_NAME: ${WEIGHT_MYSQL_DATABASE}
      DB_PORT: 3306
      TZ: Asia/Jerusalem
    ports:
      - "8082:5000"
    depends_on:
      - weight-db-prod

  # ================================
  #           BILLING DB
  # ================================
  billing-db-prod:
    image: mysql:8.0
    container_name: billing-db-prod
    restart: always
    networks:
      - purple_network
    environment:
      MYSQL_ROOT_PASSWORD: ${BILLING_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${BILLING_MYSQL_DATABASE}
      TZ: Asia/Jerusalem
    volumes:
      - ../billing/db/billingdb.sql:/docker-entrypoint-initdb.d/billingdb.sql
      - billing_db_data:/var/lib/mysql
    ports:
      - "8083:3306"

  # ================================
  #           BILLING APP
  # ================================
  billing-app-prod:
    build: ../billing
    container_name: billing-app-prod
    restart: always
    networks:
      - purple_network
    environment:
      DB_USER: ${BILLING_DB_USER}
      DB_PASSWORD: ${BILLING_DB_PASSWORD}
      DB_HOST: billing-db-prod
      DB_NAME: ${BILLING_DB_NAME}
      DB_PORT: 3306
      WEIGHT_SERVICE_URL: http://weight-app-prod:5000
      TZ: Asia/Jerusalem
      BILLING_SVC_PORT: 5000
    ports:
      - "8084:5000"
    depends_on:
      - billing-db-prod
      - weight-app-prod
